name: Core SDP Integration With GitHub Actions

# Publish only Core SDP-triggered executions of the FT Lab Appium workflow.
# This integration does not run for push or pull_request events.
on:
  workflow_run:
    workflows: ["FT Lab Appium Mobile Test"]
    types: [completed]

# Do not disable TLS validation for the OpenText SaaS endpoint.
env:
  NODE_TLS_REJECT_UNAUTHORIZED: 1

# Minimum permissions required by the current SDP CI Integration action.
permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  core_sdp_integration_job:
    # FT Lab Appium Mobile Test must include executionId in its run-name.
    # Manual runs use executionId=0 and are intentionally excluded.
    if: >-
      github.event.workflow_run.conclusion != 'cancelled' &&
      !endsWith(github.event.workflow_run.display_title, 'executionId=0')

    runs-on: ubuntu-latest
    name: CoreSDPIntegrationGitHubActions#${{ github.event.action }}#${{ github.event.workflow_run.id }}

    steps:
      - name: Publish FT Lab Appium results to OpenText Core SDP
        uses: opentext/sdp-github-actions-integration@v26.4.0
        id: githubActionsIntegration
        with:
          # OpenText Core SDP connection data retained from the original workflow.
          octaneUrl: 'https://almoctane-ams.saas.microfocus.com/'
          octaneSharedSpace: 211010
          octaneWorkspace: 75001
          octaneClientId: ${{ secrets.ALM_OCTANE_CLIENT_ID }}
          octaneClientSecret: ${{ secrets.ALM_OCTANE_CLIENT_SECRET }}

          # Automatically provided GitHub token.
          githubToken: ${{ secrets.GITHUB_TOKEN }}

          # Existing repository URL retained from the original workflow.
          serverBaseUrl: 'https://github.com/salvadorcamachogithub/AOS-Appium-S01-Browse-Abandon'

          # Core SDP pipeline and Selenium/Appium test-result configuration.
          pipelineNamePattern: '${workflow_name}'
          unitTestResultsGlobPattern: '**/target/surefire-reports/*.xml'
          testingFramework: 'testNG'
