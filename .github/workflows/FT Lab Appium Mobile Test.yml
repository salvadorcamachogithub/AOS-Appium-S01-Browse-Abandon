name: FT Lab Appium Mobile Test

run-name: FT Lab Appium Mobile Test | executionId=${{ inputs.executionId }} | publishToCoreSDP=${{ inputs.publishToCoreSDP }}

on:
  workflow_dispatch:
    inputs:
      testsToRun:
        description: Tests selected for execution by Core SDP
        required: false
        type: string
        default: ''

      suiteId:
        description: Core SDP test suite ID
        required: false
        type: number
        default: 0

      suiteRunId:
        description: Core SDP suite run ID
        required: false
        type: number
        default: 0

      executionId:
        description: Core SDP execution ID
        required: false
        type: number
        default: 0

      publishToCoreSDP:
        description: Publish this manual execution to Core SDP
        required: false
        type: boolean
        default: false

jobs:
  appium-test:
    runs-on: ubuntu-latest

    env:
      FTLAB_SERVER: ${{ vars.FTLAB_SERVER }}
      FTLAB_UDID: ${{ vars.FTLAB_UDID }}
      FTLAB_CLIENT_ID: ${{ secrets.FTLAB_CLIENT_ID }}
      FTLAB_CLIENT_SECRET: ${{ secrets.FTLAB_CLIENT_SECRET }}
      FTLAB_TENANT_ID: ${{ secrets.FTLAB_TENANT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Log Core SDP execution parameters
        shell: bash
        run: |
          echo "execution_parameter:: $(echo '${{ toJson(github.event.inputs) }}' | jq -c .)"

      - name: Validate FT Lab configuration
        shell: bash
        run: |
          test -n "$FTLAB_SERVER" || { echo "FTLAB_SERVER is missing"; exit 1; }
          test -n "$FTLAB_UDID" || { echo "FTLAB_UDID is missing"; exit 1; }
          test -n "$FTLAB_CLIENT_ID" || { echo "FTLAB_CLIENT_ID is missing"; exit 1; }
          test -n "$FTLAB_CLIENT_SECRET" || { echo "FTLAB_CLIENT_SECRET is missing"; exit 1; }
          test -n "$FTLAB_TENANT_ID" || { echo "FTLAB_TENANT_ID is missing"; exit 1; }
          echo "FT Lab configuration is available."

      - name: Run Appium test
        run: mvn test