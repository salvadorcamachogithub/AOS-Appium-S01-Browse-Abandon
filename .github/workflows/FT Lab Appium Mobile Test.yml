name: FT Lab Appium Mobile Test

on:
  workflow_dispatch:

jobs:
  appium-test:
    runs-on: ubuntu-latest

    env:
      FTLAB_SERVER: ${{ vars.FTLAB_SERVER }}
      FTLAB_UDID: ${{ vars.FTLAB_UDID }}
      FTLAB_CLIENT_ID: ${{ secrets.FTLAB_CLIENT_ID }}
      FTLAB_CLIENT_SECRET: ${{ secrets.FTLAB_CLIENT_SECRET }}
      FTLAB_TENANT_ID: ${{ secrets.FTLAB_TENANT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Validate FT Lab configuration
        shell: bash
        run: |
          test -n "$FTLAB_SERVER" || { echo "FTLAB_SERVER is missing"; exit 1; }
          test -n "$FTLAB_UDID" || { echo "FTLAB_UDID is missing"; exit 1; }
          test -n "$FTLAB_CLIENT_ID" || { echo "FTLAB_CLIENT_ID is missing"; exit 1; }
          test -n "$FTLAB_CLIENT_SECRET" || { echo "FTLAB_CLIENT_SECRET is missing"; exit 1; }
          test -n "$FTLAB_TENANT_ID" || { echo "FTLAB_TENANT_ID is missing"; exit 1; }
          echo "FT Lab configuration is available."

      - name: Run Appium test
        run: mvn test

      - name: Upload Maven test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sdp-test-results
          path: target/surefire-reports/*.xml
          if-no-files-found: error